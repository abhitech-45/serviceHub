warnings:
  - severity: MEDIUM
    message: Default local profile disables Spring AI OpenAI auto-configuration to prevent startup failure without credentials; chatbot uses deterministic fallback. Enable OpenAI through a separate keyed profile after rotating the exposed key.
  - severity: HIGH
    message: The OpenAI API key supplied in the request was not stored or used. Revoke/rotate it in OpenAI immediately and provide the replacement only through OPENAI_API_KEY at runtime.
  - severity: LOW
    message: Existing frontend JSX is formatted as a single long line; the persisted event timeline is implemented and verified, while future pending-stage rendering was left out to avoid an unrelated broad reformat.
  - severity: LOW
    message: The focused correlation/OpenAPI smoke test command was skipped by the environment after the test additions; rerun mvn -Dtest=ServiceHubApplicationTests test from backend to verify those two assertions.
  - severity: MEDIUM
    message: Docker is unavailable in the environment, so the PostgreSQL local profile was not probed. Live endpoint verification used the H2 test profile; production/local configuration remains PostgreSQL-backed.
  - severity: MEDIUM
    message: Docker is intentionally deferred; PostgreSQL/Flyway runtime migration verification remains pending.
  - severity: LOW
    message: T012, T017, and T024 remain pending; lifecycle contract coverage was added to the existing request/admin contract suites.
notes:
  - Local startup now seeds five directory-only SUPPORT_AGENT records for the admin assignment dropdown without creating shared login credentials.
  - Restored the administrator request queue, category filter, draft status/priority/assignment controls, remarks, resolution fields, and Save update action that had been commented out in the frontend.
  - Removed the static FAQ catalog, FAQ search/accordion state, FAQ view, FAQ card, and related documentation; the separate AI chatbot and Quick Access service cards remain.
  - Added responsive quick-access cards for Academic Support, Admission Assistance, Scholarships, Library, Hostel, Gym & Sports, Examination, Technical Support, Career Guidance, Transport, Finance, and Administration.
  - Removed the shared support@servicehub.local / Support@12345 login seed, test fixture, local configuration, and README references while retaining generic support-agent assignment infrastructure.
  - Added a responsive homepage hero banner featuring a campus/student study visual with accessible contrast overlay and academic-support messaging.
  - Redesigned the portal visual system for university students with blue, teal, violet, rounded cards, soft shadows, welcoming typography, and responsive mobile layouts.
  - Admin status, priority, assignment, remarks, and resolution edits are staged locally and persisted only when Save update is clicked.
  - Each committed admin update is appended to the dedicated admin_request_actions table; service_requests remains the current-state source of truth.
  - Added optional Spring AI OpenAI integration with deterministic FAQ/troubleshooting fallback when no provider is configured or the provider fails.
  - Chat ticket creation requires an explicit `confirm create:` message and status lookup is restricted to the authenticated student's owned requests.
  - Student dashboard request counts now refresh every five seconds, so admin status changes are reflected in total, open, pending, resolved, and recently updated metrics without requiring a page reload.
  - Student dashboard now shows total, open, pending, resolved, and recently updated request counts scoped to the authenticated student.
  - Admin and student logout now clear email, password, registration name, auth mode, and transient auth/workspace messages before returning to login.
  - Administrator dashboard now filters the authorized request queue by the selected campus service category and shows a matching-case count.
  - Student request editing now loads and submits the persisted sub-category, clears stale errors before saving, and updates the selected request from the successful API response.
  - Student request creation and editing now persist a validated category and sub-category from the campus services catalog.
  - Rebranded the visible product and API metadata from generic service operations to Student Support & Campus Services while preserving existing API/database namespaces.
  - Admin Save Update now shows a transient "Request updated successfully" notification after a successful backend response.
  - Student Quick Access category changes now reset subject, description, and priority instead of carrying values from the previous request form.
  - Student category cards now control request-form visibility, selected-card highlighting, fresh form initialization, and a short reveal animation.
  - Added authenticated ChatSession and ChatMessage persistence, session-aware assistant replies, intent/category/priority metadata, open-ticket lookup, and student chat quick actions.
  - OpenAI credentials are now supplied only through OPENAI_API_KEY; no key is stored in application-local.yml.
  - Confirmed chat-created requests now retain the detected campus category, valid subcategory, description, and suggested priority.
  - Fixed the chatbot visibility regression caused by legacy display:none rules; quick actions now submit immediately, and administrators receive the same working assistant widget.
  - Removed the chatbot and quick-action controls from the administrator dashboard; the assistant remains available only in the student dashboard footer.
  - Track Ticket now returns complete authenticated-student ticket details, and confirmed chat creation is covered for category-aware requests.
  - Added useful Academic Support and Placement Cell fallback guidance instead of the generic assistant response.
  - Added provider-neutral AI execution with an Anthropic-compatible Azure endpoint adapter, Spring AI provider switching, ten-second timeout handling, configurable 15-call daily quota, usage metrics, prompt-injection refusal, and 30-day chat retention.
  - Removed unused OpenAI/GPT dependency and configuration; Claude Haiku is now the only external provider path.
  - Added authenticated provider health and connectivity-test endpoints with startup validation and meaningful failure reasons.
  - Admin assignment now uses the active SUPPORT_AGENT directory and rejects arbitrary non-agent users.
  - Optional admin remarks and resolution values are normalized so blank form fields do not cause update failures.
  - Local profile seeds only the administrator; support-agent credentials are no longer hard-coded or shared.
  - Spring Boot upgraded from 3.5.5 to supported patch 3.5.16.
  - Passwords and raw credentials are not returned by API responses.
  - Frontend API client, session persistence, request workspace, responsive styling, and backend CORS preflight support are implemented.
  - Local admin login: admin@servicehub.local / Admin@12345. Override with ADMIN_EMAIL and ADMIN_PASSWORD for local development.
  - Local PostgreSQL schema mode is update, preventing application restarts from recreating stored data.
  - Admin request oversight exposes owner, category, priority, status, and timestamps; high and critical rows are visually emphasized and status/priority actions are audited.
  - Root cause of missing durable writes was a port/profile mismatch: the frontend targeted stale H2 test backend port 8080 while the current local PostgreSQL backend runs on port 8081.
  - Verified PostgreSQL 16 connection and read-after-write persistence on port 8081; frontend browser flow passed against the same backend.
