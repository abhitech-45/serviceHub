acceptance_coverage:
  - registration creates a customer account without exposing a password
  - valid credentials return access and refresh tokens
  - invalid credentials return a generic 401 response
  - protected current-user access requires a valid JWT
  - logout revokes the refresh session
  - audit records are persisted for authentication events
  - customers can create, read, update, list, and comment on owned requests
  - customers cannot read another customer's request
  - local administrator can log in and view protected overview metrics
  - customer access to administrator overview returns 403
  - administrator can list all requests with associated customer owner
  - administrator can update request status and priority
  - authenticated students receive a persisted chat session ID and assistant replies are appended to chat history
  - chat intent detection suggests a campus category and priority, supports confirmation-gated request creation, and returns owned ticket status
  - student chat quick actions populate the embedded assistant input
