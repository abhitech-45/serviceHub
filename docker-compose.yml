services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub_local
    ports:
      - "5432:5432"
    volumes:
      - servicehub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servicehub-postgres:
